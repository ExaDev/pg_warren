name: Release (prepare)

# Prepares release X.Y.Z on a branch release-X.Y.Z (release/prepare.py: the
# commit to tag, then the freeze commit) and dispatches CI on it.
# CONTRIBUTING.md, "Releases and upgrades".
#
# Two jobs, so that no write token is near the build. `prepare` runs the
# repository's code (cargo, build scripts, cargo-pgrx) with a read-only
# token that is not persisted, and hands over the two commits as a git
# bundle. `publish-branch` runs none of it: it checks the bundle is exactly
# those two commits on the dispatched main commit, touching only the files
# a release touches, then pushes the branch and dispatches ci.yml, with the
# token only in those two steps.
#
# A person opens the release PR from the compare link in the run's summary
# (GITHUB_TOKEN may not open PRs here). A workflow_dispatch made with
# GITHUB_TOKEN does start a run, so ci.yml runs on the branch's head and its
# checks show on the PR, under the names a pull_request run's have; it is
# not a pull_request event, so it includes Miri, and every pgrx-test job
# runs test/upgrade.py. Later pushes to the branch start ci.yml's
# pull_request run, which runs Miri for release-* branches too.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release, X.Y.Z (the version in development)
        required: true
        type: string
      next:
        description: The version to develop next (default X.(Y+1).0)
        required: false
        type: string
      title:
        description: The release's name in CHANGELOG's heading (optional)
        required: false
        type: string

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PGRX_VERSION: 0.19.3

jobs:
  prepare:
    name: Prepare release ${{ inputs.version }} (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      next: ${{ steps.release.outputs.next }}
    env:
      VERSION: ${{ inputs.version }}
      NEXT_VERSION: ${{ inputs.next }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # released.commits and the drift check resolve every release's commit.
          fetch-depth: 0
          persist-credentials: false
      - name: The release branch, and the next version
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, not '$VERSION'"
            exit 1
          fi
          IFS=. read -r major minor _ <<<"$VERSION"
          next="${NEXT_VERSION:-$major.$((minor + 1)).0}"
          if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::next must be X.Y.Z, not '$next'"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release-$VERSION" >/dev/null; then
            echo "::error::release-$VERSION already exists: delete the branch (and close any PR) to prepare $VERSION again"
            exit 1
          fi
          echo "next=$next" >>"$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        # A stalled PGDG mirror once held a job here for hours; fail and re-run instead.
        timeout-minutes: 30
        with:
          pg-major: "16"
      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: cargo pgrx init
        run: cargo pgrx init --pg16 "$PG_CONFIG"
      - name: release/prepare.py ${{ inputs.version }}
        env:
          NEXT: ${{ steps.release.outputs.next }}
          PG: pg16
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release-$VERSION"
          args=("$VERSION" "$NEXT")
          if [[ -n "$TITLE" ]]; then args+=(--title "$TITLE"); fi
          python3 release/prepare.py "${args[@]}"
          git bundle create "$RUNNER_TEMP/release.bundle" "$GITHUB_SHA..release-$VERSION"
          {
            echo "## release-$VERSION: CHANGELOG's $VERSION section (the PR body)"
            echo
            python3 release/changelog.py notes "$VERSION"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 7

  publish-branch:
    name: Push release-${{ inputs.version }} and dispatch CI
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ inputs.version }}
      NEXT: ${{ needs.prepare.outputs.next }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      - name: The bundle is the release's two commits on ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="release-$VERSION"
          bundle="$RUNNER_TEMP/bundle/release.bundle"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" "refs/heads/$branch:refs/heads/$branch"
          fail() { echo "::error::$*"; exit 1; }
          [[ "$(git rev-list --count "$GITHUB_SHA..$branch")" == 2 ]] || fail "$branch is not two commits on $GITHUB_SHA"
          [[ -z "$(git rev-list --merges "$GITHUB_SHA..$branch")" ]] || fail "$branch has a merge commit"
          tagged="$(git rev-parse "$branch~1")"
          [[ "$(git rev-parse "$branch~2")" == "$GITHUB_SHA" ]] || fail "$branch does not start at $GITHUB_SHA"
          [[ "$(git log -1 --format=%s "$tagged")" == "release: $VERSION" ]] || fail "unexpected subject of $tagged"
          [[ "$(git log -1 --format=%s "$branch")" == "release: freeze $VERSION, develop $NEXT" ]] \
            || fail "unexpected subject of the freeze commit"
          expect() {
            diff <(git diff --no-renames --name-status "$1" "$2" | sort) <(printf '%s\n' "${@:3}" | sort) \
              || fail "$2 changes other files than a release does"
          }
          expect "$GITHUB_SHA" "$tagged" "M	CHANGELOG.md" "M	README.md"
          expect "$tagged" "$branch" "M	CHANGELOG.md" "M	Cargo.lock" "M	Cargo.toml" \
            "A	sql/pg_warren--$NEXT.sql" "A	sql/pg_warren--$VERSION--$NEXT.sql" \
            "M	sql/released.commits" "M	sql/released.sha256"
          diff <(git diff -U0 "$tagged" "$branch" -- sql/released.commits | grep '^[-+][^-+]') \
            <(echo "+$tagged  $VERSION") || fail "sql/released.commits does not record $tagged for $VERSION"
      - name: Push release-${{ inputs.version }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "refs/heads/release-$VERSION:refs/heads/release-$VERSION"
      - name: Dispatch CI on release-${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "release-$VERSION"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release-$VERSION?expand=1"
          {
            echo "Prepared $VERSION on \`release-$VERSION\`; CI (with Miri and test/upgrade.py) is dispatched on it."
            echo
            echo "Open the release PR: $compare"
            echo "Title it \`release: $VERSION\`, use the prepare job's summary (CHANGELOG's section) as its body,"
            echo "and merge it with a merge commit. Release (publish) then tags v$VERSION after approval."
          } >>"$GITHUB_STEP_SUMMARY"
