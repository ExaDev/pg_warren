name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  PGRX_VERSION: 0.19.3
  # Dated nightly for Miri. Bump deliberately, after checking it locally.
  MIRI_NIGHTLY: nightly-2026-10-15

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  core-isolation:
    name: warren-core has no Postgres dependency (§15.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo tree -p warren-core must not mention pgrx / pg-sys
        run: |
          set -euo pipefail
          tree="$(cargo tree -p warren-core -e all --prefix none)"
          if echo "$tree" | grep -E 'pgrx|pg[-_]sys'; then
            echo "::error::warren-core depends on a Postgres crate (DESIGN.md §11, §15.4)"
            exit 1
          fi
          echo "ok: warren-core is Postgres-free"

  core-test:
    name: warren-core unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      # --all-targets also builds the criterion benches and runs each once in
      # test mode, so no separate bench-compile job is needed.
      - run: cargo test -p warren-core --all-targets
      - run: cargo test -p warren-core --doc

  miri:
    name: warren-core under Miri (pinned nightly)
    runs-on: ubuntu-latest
    env:
      # Miri is slow: keep property tests small and off the filesystem.
      PROPTEST_CASES: "16"
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "true"
      # proptest reads the working directory and OS randomness.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install "$MIRI_NIGHTLY" --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
      - run: cargo "+$MIRI_NIGHTLY" miri setup
      - run: cargo "+$MIRI_NIGHTLY" miri test -p warren-core

  fuzz:
    name: Segment decoder fuzzing (pinned nightly, 30 s per target)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode_csr, decode_id_map, decode_tombstones, decode_relation_dictionary]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$MIRI_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz
      - working-directory: fuzz
        run: cargo "+$MIRI_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=30

  lint:
    name: Clippy + rustdoc (PG 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        with:
          pg-major: "16"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (pg_warren with pg_test)
        run: cargo clippy -p pg_warren --all-targets --features pg_test -- -D warnings
      - name: rustdoc
        run: cargo doc --workspace --no-deps

  pgrx-test:
    name: pgrx tests (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        with:
          pg-major: ${{ matrix.pg }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pg${{ matrix.pg }}
          # cargo-pgrx is cached on its own below; its key survives Cargo.lock changes.
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Let the runner user install into the PG ${{ matrix.pg }} tree
        run: |
          sudo chmod a+rwx "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
      - name: cargo pgrx init
        run: cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"
      - name: cargo pgrx test pg${{ matrix.pg }}
        working-directory: crates/pg_warren
        run: cargo pgrx test pg${{ matrix.pg }}
      - name: Schema drift against sql/pg_warren--<version>.sql
        if: matrix.pg == '16'
        run: PG=pg16 sql/schema-drift.sh

  harness:
    # The out-of-crate harness (DESIGN.md §12): generator and harness pytest
    # tests, the test/ SQL suite against an installed pg_warren, and one smoke
    # run of the benchmark matrix.
    name: Generators + SQL harness (PG 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        with:
          pg-major: "16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - run: pip install -r bench/requirements.txt
      - name: pytest (generators, harness, oracle)
        run: pytest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: harness
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Let the runner user install into the PG 16 tree
        run: |
          sudo chmod a+rwx "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
      - name: cargo pgrx init
        run: cargo pgrx init --pg16 "$PG_CONFIG"
      - name: SQL harness (test/run.py)
        run: python test/run.py --pg-config "$PG_CONFIG"
      - name: Benchmark matrix smoke run
        run: bench/run.sh smoke --no-install --pg-config "$PG_CONFIG" --results bench/tmp

  docker:
    # Runs on every event; buildx's GHA cache keeps the toolchain and
    # cargo-pgrx layers warm, so only the extension build reruns.
    name: Docker image builds (PG 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: PG_MAJOR=16
          tags: pg_warren:pg16
          load: true
          cache-from: type=gha,scope=docker-pg16
          cache-to: type=gha,scope=docker-pg16,mode=max
      - name: CREATE EXTENSION in the image
        run: |
          set -euo pipefail
          docker run -d --name pgw -e POSTGRES_PASSWORD=postgres pg_warren:pg16
          # The entrypoint's init server listens only on the Unix socket and
          # then restarts, so wait for TCP, which only the final server opens.
          ready=0
          for _ in $(seq 1 60); do
            if docker exec pgw pg_isready -h 127.0.0.1 -U postgres; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::postgres did not become ready over TCP within 60s"
            docker logs pgw
            exit 1
          fi
          docker exec pgw psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_warren' -c 'SELECT warren.version()'
