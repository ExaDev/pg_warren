name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  PGRX_VERSION: 0.19.3
  # Dated nightly for Miri. Bump deliberately, after checking it locally.
  MIRI_NIGHTLY: nightly-2026-10-15

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  core-isolation:
    name: warren-core has no Postgres dependency (§15.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo tree -p warren-core must not mention pgrx / pg-sys
        run: |
          set -euo pipefail
          tree="$(cargo tree -p warren-core -e all --prefix none)"
          if echo "$tree" | grep -E 'pgrx|pg[-_]sys'; then
            echo "::error::warren-core depends on a Postgres crate (DESIGN.md §11, §15.4)"
            exit 1
          fi
          echo "ok: warren-core is Postgres-free"

  core-test:
    name: warren-core unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
      # --all-targets also builds the criterion benches and runs each once in
      # test mode, so no separate bench-compile job is needed.
      - run: cargo test -p warren-core --all-targets
      - run: cargo test -p warren-core --doc

  miri:
    name: warren-core under Miri (pinned nightly)
    # Off the pull-request path: warren-core has no unsafe code, so Miri can
    # only find undefined behaviour in dependencies, and it takes 20+ minutes.
    # It runs on every push to main, on demand (release-prepare.yml
    # dispatches CI on each release branch) and on release PRs.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    env:
      # Miri is slow: keep property tests small and off the filesystem.
      PROPTEST_CASES: "16"
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "true"
      # proptest reads the working directory and OS randomness.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with Miri
        run: rustup toolchain install "$MIRI_NIGHTLY" --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
      - run: cargo "+$MIRI_NIGHTLY" miri setup
      - run: cargo "+$MIRI_NIGHTLY" miri test -p warren-core

  fuzz:
    name: Segment decoder fuzzing (pinned nightly, 30 s per target)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode_csr, decode_id_map, decode_text_id_map, decode_tombstones, decode_relation_dictionary, decode_membership]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$MIRI_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz
      - working-directory: fuzz
        run: cargo "+$MIRI_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=30

  lint:
    name: Clippy + rustdoc (PG 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        # A stalled PGDG mirror once held a job here for hours; fail and re-run instead.
        timeout-minutes: 30
        with:
          pg-major: "16"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (pg_warren with pg_test)
        run: cargo clippy -p pg_warren --all-targets --features pg_test -- -D warnings
      - name: rustdoc
        run: cargo doc --workspace --no-deps

  pgrx-test:
    name: pgrx tests (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
        with:
          # test/upgrade.py builds each release from its commit in
          # sql/released.commits, which needs the full history.
          fetch-depth: 0
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        # A stalled PGDG mirror once held a job here for hours; fail and re-run instead.
        timeout-minutes: 30
        with:
          pg-major: ${{ matrix.pg }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pg${{ matrix.pg }}
          # cargo-pgrx is cached on its own below; its key survives Cargo.lock changes.
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Let the runner user install into the PG ${{ matrix.pg }} tree
        run: |
          sudo chmod a+rwx "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
      - name: cargo pgrx init
        run: cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"
      - name: cargo pgrx test pg${{ matrix.pg }}
        working-directory: crates/pg_warren
        run: cargo pgrx test pg${{ matrix.pg }}
      - name: Cache the release builds (source, target directory per release and major, release cargo-pgrx)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pg_warren-releases
          # sql/released.commits fixes each release's source, and so the pgrx
          # (and cargo-pgrx) its Cargo.lock pins and the toolchain it pins.
          key: releases-pg${{ matrix.pg }}-${{ hashFiles('sql/released.sha256', 'sql/released.commits') }}-pgrx-${{ env.PGRX_VERSION }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Upgrade path from every release (test/upgrade.py)
        # ALTER EXTENSION UPDATE from each released version must give the
        # catalog of a fresh install of the version in development, on every
        # major (the catalog, and what pgrx generates, differ by major). Each
        # release's state is written by that release's own build, from the
        # commit sql/released.commits records for it. The harness is
        # standard-library Python.
        run: python3 test/upgrade.py --pg-config "$PG_CONFIG" --release-builds ~/.cache/pg_warren-releases
      - name: Upgrade path from every release, installed and updated by a non-superuser
        # A trusted install (DESIGN.md §7): the database owner, not a
        # superuser, runs CREATE and ALTER EXTENSION.
        run: python3 test/upgrade.py --no-install --trusted --pg-config "$PG_CONFIG" --release-builds ~/.cache/pg_warren-releases
      - name: pg_dump and restore (test/dump.py)
        # DESIGN.md §5.1: a dump of graphs, versions and vectors restores
        # through psql and pg_restore, each statement in its own transaction;
        # a trusted install's installer dumps without the catalog's data.
        run: python3 test/dump.py --no-install --pg-config "$PG_CONFIG"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - name: The harness's Python dependencies (test/run.py imports the oracle)
        run: pip install -r bench/requirements.txt
      - name: Shared cache across backends (test/run.py --shared-cache)
        # DESIGN.md §5.6: the multi-backend tests and the statement pin's,
        # with the shared cache off (a cap of 0), preloaded with a cap, and
        # at the default configuration (the default 4GB cap: shared on PG 17
        # and 18, unavailable and so private on PG 15 and 16). The harness
        # job runs the whole suite at the default and preloaded on PG 16.
        run: |
          for mode in off preload on; do
            python test/run.py --no-install --shared-cache "$mode" --pg-config "$PG_CONFIG" \
              test/sql/shared_cache_*.sql test/sql/cache_statement_pin.sql
          done
      - name: Schema drift against sql/pg_warren--<version>.sql
        if: matrix.pg == '16'
        run: PG=pg16 sql/schema-drift.sh

  arm64:
    # Most hosted Postgres runs on arm64 (DESIGN.md §13, M11 Distribution).
    # The build and the in-database tests on two majors, 16 (the
    # development baseline, private versions without the preload) and 18
    # (shared by default, so the shared cache's atomics run on arm64's
    # weaker memory ordering), and the SQL harness at the default and
    # preloaded. Not on arm64: Miri and the fuzzers (warren-core is
    # arch-independent safe Rust), test/upgrade.py and test/dump.py (catalog
    # paths, covered on x86_64 for every major), clippy and rustdoc.
    name: arm64 pgrx tests + SQL harness (PG ${{ matrix.pg }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "18"]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        # A stalled PGDG mirror once held a job here for hours; fail and re-run instead.
        timeout-minutes: 30
        with:
          pg-major: ${{ matrix.pg }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64-pg${{ matrix.pg }}
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Let the runner user install into the PG ${{ matrix.pg }} tree
        run: |
          sudo chmod a+rwx "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
      - name: cargo pgrx init
        run: cargo pgrx init --pg${{ matrix.pg }} "$PG_CONFIG"
      - name: cargo pgrx test pg${{ matrix.pg }}
        working-directory: crates/pg_warren
        run: cargo pgrx test pg${{ matrix.pg }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - run: pip install -r bench/requirements.txt
      - name: SQL harness (test/run.py)
        run: python test/run.py --pg-config "$PG_CONFIG"
      - name: SQL harness with the shared cache preloaded (test/run.py --shared-cache preload)
        run: python test/run.py --no-install --shared-cache preload --pg-config "$PG_CONFIG"

  macos:
    # Apple silicon with Homebrew's PostgreSQL. macOS has no /dev/shm: DSM
    # segments are POSIX shared memory with no file system to measure, so
    # the shared cache is expected to find no room and degrade to private
    # copies (DESIGN.md §5.6), and tests that expect sharing to fail. It
    # runs everything and reports; until macOS is supported it does not
    # fail the workflow (continue-on-error), so read its result.
    name: macOS arm64 pgrx tests + SQL harness (Homebrew PG 18)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install postgresql@18 from Homebrew
        run: |
          brew install postgresql@18
          echo "PG_CONFIG=$(brew --prefix postgresql@18)/bin/pg_config" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-pg18
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: cargo pgrx init
        run: cargo pgrx init --pg18 "$PG_CONFIG"
      - name: cargo pgrx test pg18
        working-directory: crates/pg_warren
        run: cargo pgrx test pg18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - run: pip install -r bench/requirements.txt
      - name: SQL harness (test/run.py)
        if: ${{ !cancelled() }}
        run: python test/run.py --pg-config "$PG_CONFIG"
      - name: SQL harness with the shared cache preloaded (test/run.py --shared-cache preload)
        if: ${{ !cancelled() }}
        run: python test/run.py --no-install --shared-cache preload --pg-config "$PG_CONFIG"
      - name: The tap's formula passes brew style and brew audit
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          brew tap-new --no-git exadev/tap
          python3 release/homebrew.py 0.0.0 "$(printf '%064d' 0)" "$PGRX_VERSION" \
            >"$(brew --repo exadev/tap)/Formula/pg_warren.rb"
          brew style exadev/tap/pg_warren
          brew audit --strict --formula exadev/tap/pg_warren

  harness:
    # The out-of-crate harness (DESIGN.md §12): generator and harness pytest
    # tests, the test/ SQL suite against an installed pg_warren, and one smoke
    # run of the benchmark matrix.
    name: Generators + SQL harness (PG 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test/tests/test_releases.py resolves the commits in
          # sql/released.commits, which needs the full history.
          fetch-depth: 0
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        # A stalled PGDG mirror once held a job here for hours; fail and re-run instead.
        timeout-minutes: 30
        with:
          pg-major: "16"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - run: pip install -r bench/requirements.txt
      - name: pytest (generators, harness, oracle)
        run: pytest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: harness
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Let the runner user install into the PG 16 tree
        run: |
          sudo chmod a+rwx "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
      - name: cargo pgrx init
        run: cargo pgrx init --pg16 "$PG_CONFIG"
      - name: SQL harness (test/run.py)
        # The default configuration (--shared-cache on): on PG 16 without
        # the preload, versions load privately, and no NOTICE says so.
        run: python test/run.py --pg-config "$PG_CONFIG"
      - name: SQL harness with a trusted install (test/run.py --trusted)
        # DESIGN.md §7: each test database's pg_warren is installed by a
        # non-superuser that owns the database, as on hosted Postgres, so the
        # catalog's owner (the bootstrap superuser) and the extension's differ.
        run: python test/run.py --no-install --trusted --pg-config "$PG_CONFIG"
      - name: SQL harness with the shared cache preloaded (test/run.py --shared-cache preload)
        # DESIGN.md §5.6: every test again, with versions shared between
        # backends.
        run: python test/run.py --no-install --shared-cache preload --pg-config "$PG_CONFIG"
      - name: Benchmark matrix smoke run
        run: bench/run.sh smoke --no-install --pg-config "$PG_CONFIG" --results bench/tmp

  docker:
    # Runs on every event; buildx's GHA cache keeps the toolchain and
    # cargo-pgrx layers warm, so only the extension build reruns.
    name: Docker image builds (PG 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: PG_MAJOR=16
          tags: pg_warren:pg16
          load: true
          cache-from: type=gha,scope=docker-pg16
          cache-to: type=gha,scope=docker-pg16,mode=max
      - name: CREATE EXTENSION in the image
        run: |
          set -euo pipefail
          docker run -d --name pgw -e POSTGRES_PASSWORD=postgres pg_warren:pg16
          # The entrypoint's init server listens only on the Unix socket and
          # then restarts, so wait for TCP, which only the final server opens.
          ready=0
          for _ in $(seq 1 60); do
            if docker exec pgw pg_isready -h 127.0.0.1 -U postgres; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::postgres did not become ready over TCP within 60s"
            docker logs pgw
            exit 1
          fi
          docker exec pgw psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_warren' -c 'SELECT warren.version()'
          # A trusted install: a non-superuser that owns its database.
          docker exec pgw psql -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE app LOGIN' -c 'CREATE DATABASE app OWNER app'
          docker exec pgw psql -U app -d app -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION pg_warren' -c 'SELECT warren.version()'

  packages:
    # The .deb path the release takes (release-publish.yml), for one package:
    # built in Debian 12's container against PGDG, installed with apt into a
    # clean container with PGDG's PostgreSQL, preloaded, restarted and
    # smoke-tested (superuser and trusted), then the Docker image built from
    # it and the same test run in it. CONTRIBUTING.md, "Packages".
    name: Debian package and image (PG 16, bookworm, amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build postgresql-16-pg-warren (release/packages.py deb)
        run: python3 release/packages.py deb bookworm . dist --majors 16
      - name: Install it with apt, preload, restart, smoke test
        run: python3 release/packages.py check dist/postgresql-16-pg-warren_*.deb
      - name: Tarball from it
        run: python3 release/packages.py tarball dist/postgresql-16-pg-warren_*.deb dist
      - name: Docker image from it, and its smoke test
        run: python3 release/packages.py image dist/postgresql-16-pg-warren_*.deb pg_warren:ci-pg16

  packages-arm64:
    # The same on arm64 and Ubuntu, off the pull-request path (as Miri):
    # on pushes to main, dispatches (each release branch) and release PRs,
    # so a release's arm64 and Ubuntu builds are proven before it is tagged.
    name: Debian package and image (PG 18, noble, arm64)
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build postgresql-18-pg-warren (release/packages.py deb)
        run: python3 release/packages.py deb noble . dist --majors 18
      - name: Install it with apt, preload, restart, smoke test
        run: python3 release/packages.py check dist/postgresql-18-pg-warren_*.deb

  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go's checksum database verifies the module; shellcheck, on the
      # runner, checks each run: script.
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: ~/go/bin/actionlint -color
