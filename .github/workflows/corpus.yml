name: Real graphs (nightly)

# bench/corpus's tiny tier (DESIGN.md §12 "Real graphs", §13 M11): the nine
# keepset datasets fetched by keepset's recipes and checked against
# pins.json, loaded, built by a release build and checked against NetworkX
# and igraph. It reads third-party hosts (SNAP, Newman's netdata, KONECT,
# Netzschleuder, the KGE mirror), so it runs nightly and on demand, never on
# a pull request or a push: it does not gate merges. A failure fails this
# run red, and the step summary says what did not match.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  PGRX_VERSION: 0.19.3

jobs:
  tiny:
    name: bench/corpus check --tier tiny (PG 16, release)
    runs-on: ubuntu-latest
    # About 25 s to fetch (nothing on a warm cache), 3 min to check (2.5 of
    # them WN18RR's exact betweenness) and a release build of 5–15 min: a
    # run that hangs on a host fails instead of holding a runner for the
    # default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Where the datasets and the results go
        run: |
          echo "WARREN_CORPUS_CACHE=$HOME/.cache/warren-corpus" >>"$GITHUB_ENV"
          echo "RESULTS=$RUNNER_TEMP/corpus-results" >>"$GITHUB_ENV"
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/setup-postgres
        # A stalled PGDG mirror once held a job here for hours; fail and re-run instead.
        timeout-minutes: 30
        with:
          pg-major: "16"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: corpus
          cache-bin: "false"
      - name: Cache cargo-pgrx ${{ env.PGRX_VERSION }}
        id: cargo-pgrx-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: cargo-pgrx-${{ env.PGRX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-pgrx
        if: steps.cargo-pgrx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
      - name: Let the runner user install into the PG 16 tree
        run: |
          sudo chmod a+rwx "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
      - name: cargo pgrx init
        run: cargo pgrx init --pg16 "$PG_CONFIG"
      - name: Install a release build
        working-directory: crates/pg_warren
        run: cargo pgrx install --release --pg-config "$PG_CONFIG"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - run: pip install -r bench/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Cache the keepset CLI (npm ci from the committed lock)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/warren-corpus/keepset-*
          key: keepset-${{ runner.os }}-${{ hashFiles('bench/corpus/keepset_cli/package-lock.json', 'bench/corpus/manifest.json') }}
      - name: Cache the tiny tier's tables
        # Keyed by the pins (the bytes each dataset must be) and the code
        # that turns those bytes into tables, so a cached table is one a
        # fetch now would write. A miss fetches, and a fetch whose bytes
        # differ from pins.json fails (PinMismatch).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/warren-corpus/datasets
          key: corpus-tiny-${{ hashFiles('bench/corpus/pins.json', 'bench/corpus/manifest.json', 'bench/corpus/fetch.py', 'bench/corpus/graph_v1.py', 'bench/corpus/tables.py') }}
      - name: The tiny tier's datasets, but transport-airline
        # raw.githubusercontent.com sends transport-airline's routes.dat
        # gzip-encoded to a GitHub runner even though keepset asks for no
        # encoding, and keepset keeps a response's bytes as sent, so it
        # reads gzip as text. It is checked where the fetch works (§12).
        run: |
          {
            printf 'DATASETS='
            python -c "import json; d = json.load(open('bench/corpus/manifest.json'))['datasets']; print(' '.join(n for n, s in d.items() if s['tier'] == 'tiny' and n != 'transport-airline'))"
          } >>"$GITHUB_ENV"
      - name: Fetch them (keepset, checked against pins.json)
        run: |
          read -ra datasets <<<"$DATASETS"
          python bench/corpus/suite.py fetch "${datasets[@]}"
      - name: Every tiny dataset was pinned before this run
        # A dataset without a pin would be pinned by this fetch, unchecked.
        run: git diff --exit-code bench/corpus/pins.json
      - name: Check against NetworkX and igraph
        run: |
          read -ra datasets <<<"$DATASETS"
          python bench/corpus/suite.py check "${datasets[@]}" --pg-config "$PG_CONFIG" --results "$RESULTS" \
            --extension-revision "$(git rev-parse --short HEAD)" --extension-profile release
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          read -ra datasets <<<"$DATASETS"
          {
            echo "## bench/corpus check --tier tiny ($(git rev-parse --short HEAD))"
            echo
            if [ -d "$RESULTS/correctness" ]; then
              python bench/corpus/suite.py summary "${datasets[@]}" --results "$RESULTS"
            else
              echo "No results: the run stopped before checking (see the fetch step)."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-tiny
          path: ${{ env.RESULTS }}
          if-no-files-found: ignore
