name: Set up PostgreSQL (PGDG)
description: >
  Install a PostgreSQL major with server dev headers from the PGDG apt repo,
  plus libclang for pgrx's bindgen (the runner image's, if it has one), and export PG_CONFIG / PGRX_PG_CONFIG_PATH.
inputs:
  pg-major:
    description: PostgreSQL major version (15, 16, 17, 18)
    required: true
runs:
  using: composite
  steps:
    - name: Install PostgreSQL ${{ inputs.pg-major }} from PGDG
      shell: bash
      env:
        PG_MAJOR: ${{ inputs.pg-major }}
      run: |
        set -euxo pipefail
        # A stalled mirror connection fails and retries rather than hanging.
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        # From PG 18, PGDG ships the LLVM JIT provider (llvmjit.so) as its own
        # package, only recommended by postgresql-NN; earlier majors bundle it.
        # pg_warren's vector_map tests exercise JIT, so install it explicitly.
        jit=()
        if [ "$PG_MAJOR" -ge 18 ]; then jit=("postgresql-${PG_MAJOR}-jit"); fi
        # The runner image already ships clang with libclang; installing
        # clang/libclang-dev pulled ~95 MB of LLVM 19 from an Ubuntu mirror
        # that trickled at ~80 kB/s for a whole step (2026-10-22, PG 17).
        # Use the image's libclang when it has one, else install it.
        clang=(libclang-dev clang)
        libclang=$(ls -d /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | sort -V | tail -n 1 || true)
        if [ -n "$libclang" ]; then
          clang=()
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
        fi
        # Show apt's progress, never wait on a prompt, and give each attempt
        # ten minutes; a retry resumes the downloads already made.
        export DEBIAN_FRONTEND=noninteractive
        for attempt in 1 2 3; do
          if sudo --preserve-env=DEBIAN_FRONTEND timeout 600 apt-get install -y --no-install-recommends \
            "postgresql-${PG_MAJOR}" "${jit[@]}" "postgresql-server-dev-${PG_MAJOR}" "${clang[@]}"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then exit 1; fi
          sudo dpkg --configure -a || true
        done
        test -f "$("/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config" --pkglibdir)/llvmjit.so"
        PG_CONFIG="/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"
        "$PG_CONFIG" --version
        echo "PG_CONFIG=$PG_CONFIG" >> "$GITHUB_ENV"
        # Lets pgrx-pg-sys build without `cargo pgrx init` (clippy, doc).
        echo "PGRX_PG_CONFIG_PATH=$PG_CONFIG" >> "$GITHUB_ENV"
