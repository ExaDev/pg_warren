[package]
name = "warren-core"
description = "Graph structure, traversal and compute kernels for pg_warren. No Postgres dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = "2"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "csr_build"
harness = false

[[bench]]
name = "relation_layout"
harness = false

[[bench]]
name = "traversal"
harness = false

[[bench]]
name = "version_diff"
harness = false

[lints]
workspace = true
