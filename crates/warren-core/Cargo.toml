[package]
name = "warren-core"
description = "Graph structure, traversal and compute kernels for pg_warren. No Postgres dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
rayon = "1.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "centrality"
harness = false

[[bench]]
name = "compute"
harness = false

[[bench]]
name = "csr_build"
harness = false

[[bench]]
name = "dijkstra"
harness = false

[[bench]]
name = "gather"
harness = false

[[bench]]
name = "relation_layout"
harness = false

[[bench]]
name = "sparse_offsets"
harness = false

[[bench]]
name = "spectral"
harness = false

[[bench]]
name = "spmv_out_of_cache"
harness = false

[[bench]]
name = "structure"
harness = false

[[bench]]
name = "traversal"
harness = false

[[bench]]
name = "version_diff"
harness = false

[[bench]]
name = "walk"
harness = false

[lints]
workspace = true
