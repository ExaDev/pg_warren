[package]
name = "pg_warren"
description = "Index-free-adjacency traversal and graph compute for PostgreSQL."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.99.1"
# Released as a PostgreSQL extension (CONTRIBUTING.md, "Packages"), never to
# crates.io: cargo-deny then allows its path dependency on warren-core.
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
libc = "0.2"
pgrx = "=0.20.1"
serde_json = "1"
thiserror = "2"
warren-core = { path = "../warren-core" }

[dev-dependencies]
pgrx-tests = "=0.20.1"
proptest = "1"

[lints]
workspace = true
